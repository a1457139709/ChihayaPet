<script>
const themes={elegant:{name:'淡雅 · 藤风',desc:'米白与浅藤紫，像一阵经过窗边的风。姓名牌轻柔，叶纹只在边角留下痕迹；给文字留出安静的空间。',colors:['#F7F4ED','#45414E','#8F7DA8','#A5B2A0'],speed:45},scholarly:{name:'知性 · 书室',desc:'羊皮纸色与墨蓝，配一圈克制的古金双线。书签式姓名牌与清晰排版，让每一句话像书页间的一段批注。',colors:['#F0E7D5','#28364B','#354D68','#B29360'],speed:38},impish:{name:'小恶魔 · 绯夜',desc:'深梅紫中藏着莓红，浅色文字清晰浮出。边角不完全对称，句末一点亮色，像话说完之后才露出的笑意。',colors:['#2E2038','#F5E8F0','#CB7E9F','#AF587B'],speed:32},chihaya:{name:'千早 · 紫苑夜奏',desc:'珍珠白信纸、深墨紫姓名牌，香槟金勾边与低调的鸢尾。优雅、高贵是第一眼；暗酒红的继续标记，留下温柔而狡黠的余韵。',colors:['#F6F0EA','#42384D','#695277','#B99B69'],speed:42}};
themes.elegant.desc='米白长方形，浅藤紫字色。细小扇贝花边与四角藤蔓刺绣，像一方轻盈的蕾丝信笺。';
themes.scholarly.desc='羊皮纸与墨蓝的长方形框，古金卷草角花、疏密有序的花边，保留藏书票般的知性气质。';
themes.impish.desc='深梅紫长方形，莓红密蕾丝与更醒目的角花。以暖白正文和纤细衬线姓名，平衡暗色的俏皮。';
themes.chihaya.desc='鸢尾浅紫与栀子象牙白，花枝从边框自然探出。撤去深色姓名牌，以烟紫细宋体书写名字、青灰宋体承接对白；银绿细线和大幅留白，呈现安静而细腻的精致感。';
themes.chihaya.colors=['#F7F7F0','#4C5556','#6B6081','#A7B3A8'];
themes.elegant.desc='米白与浅藤紫，边框改为参考图式的双细线与四角回环花饰。装饰沿边缘延伸，正文区保持干净。';
themes.scholarly.desc='羊皮纸与墨蓝，棕金双线勾边，四角以对称的回环卷线收束，保留古典书页的气质。';
themes.impish.desc='深梅紫与暖白正文，莓红双线和四角回环，带一点精致、俏皮的暗色气息。';
themes.chihaya.desc='保留鸢尾、栀子与回环花边。名字换成柔和的玫瑰紫手写风，正文用暖紫灰圆体；收紧字距、去掉英文副标题，让千早更像在身旁轻声聊天。';
themes.chihaya.colors=['#F7F7F0','#66576A','#A06F91','#A7B3A8'];
const lines=['不必急着回答。我只是想，\n若能与你这样安静地待一会儿，也很好。','你似乎很在意我的想法呢。\n呵呵……那么，这句话就先留到下次再说吧。','书签会替人记住故事停下的地方。\n至于今天的话，我想，我会好好听完。'];
const box=document.querySelector('.dialogue'),words=document.querySelector('.words'),next=document.querySelector('.next');let active='chihaya',page=0,count=0,timer;
function draw(){words.innerText=Array.from(lines[page]).slice(0,count).join('');next.textContent=count<Array.from(lines[page]).length?'显示全文 ◇':'下一句 ◆';}
function start(){clearTimeout(timer);count=0;draw();if(matchMedia('(prefers-reduced-motion: reduce)').matches){count=Array.from(lines[page]).length;draw();return;}function step(){count++;draw();if(count<Array.from(lines[page]).length)timer=setTimeout(step,/[,，。！？…]/.test(Array.from(lines[page])[count-1])?220:themes[active].speed);}timer=setTimeout(step,180);}
function advance(){if(count<Array.from(lines[page]).length){clearTimeout(timer);count=Array.from(lines[page]).length;draw();}else{page=(page+1)%lines.length;start();}}
// Only Chihaya is in the approved development scope; no theme selector.
function select(key){active=key;box.dataset.theme=key;document.querySelectorAll('[data-motif]').forEach(g=>g.style.display=g.dataset.motif===key?'':'none');document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.key===key));document.querySelector('#themeTitle').textContent=themes[key].name;document.querySelector('#description').textContent=themes[key].desc;document.querySelector('.swatches').replaceChildren(...themes[key].colors.map(c=>{const s=document.createElement('span');s.className='swatch';s.style.background=c;s.title=c;return s;}));box.style.opacity=1;start();}
words.onclick=next.onclick=advance;words.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();advance();}};document.querySelector('.close').onclick=()=>{clearTimeout(timer);box.style.opacity=.15;setTimeout(()=>{box.style.opacity=1;start();},600);};document.querySelector('#import').onclick=()=>{document.querySelector('#musicNote').textContent='这是音乐设置的设计预览。正式实现后，此处将打开本地音频选择器。';};select(active);
</script>
</html>
