<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; connect-src 'none'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>千早的话</title>
  <link rel="stylesheet" href="theme.css">
  <script defer src="bubble.js"></script>
</head>
<body class="bubble-page">
  <main id="bubble-root" class="speech-bubble" hidden>
    <div class="bubble-flower iris" aria-hidden="true"></div>
    <div class="bubble-flower gardenia" aria-hidden="true"></div>
    <header><strong>妃宫千早</strong><button id="bubble-close" type="button" aria-label="关闭气泡" title="关闭气泡">×</button></header>
    <p id="bubble-text" title="点击立即显示全文"></p>
    <button id="bubble-full" class="text-button" type="button">查看完整对话</button>
  </main>
</body>
</html>
