<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; media-src 'self' file:; style-src 'self'; script-src 'self'; connect-src 'none'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>千早桌宠</title>
  <link rel="stylesheet" href="theme.css">
  <script defer src="panel.js"></script>
</head>
<body class="panel-page">
  <main class="panel-shell">
    <header class="panel-header">
      <div class="flower-mark" aria-hidden="true"><i></i><i></i><i></i></div>
      <div><h1>妃宫千早</h1><p>在熟悉的桌面，留一点陪伴。</p></div>
      <button id="close-panel" class="icon-button" type="button" aria-label="收起面板" title="收起面板 · Escape">×</button>
    </header>
    <nav class="tabs" role="tablist" aria-label="功能">
      <button type="button" data-tab="chat" role="tab">对话</button>
      <button type="button" data-tab="settings" role="tab">设置</button>
      <button type="button" data-tab="music" role="tab">音乐</button>
    </nav>

    <section class="page chat-page" data-page="chat" role="tabpanel">
      <div id="chat-messages" class="chat-messages" aria-live="polite"></div>
      <div class="composer">
        <label class="sr-only" for="chat-input">消息</label>
        <textarea id="chat-input" placeholder="想和我聊些什么？"></textarea>
        <div class="composer-actions">
          <button id="clear-button" type="button" class="quiet-button" disabled>清空</button>
          <button id="retry-button" type="button" hidden>重试</button>
          <span id="chat-count">0/2000</span>
          <button id="cancel-button" type="button" hidden>取消</button>
          <button id="send-button" type="button" class="primary" disabled>发送</button>
        </div>
        <small>聊天仅在本次运行中保留 · Shift+Enter 换行</small>
      </div>
    </section>

    <section class="page settings-page" data-page="settings" role="tabpanel" hidden>
      <div class="settings-grid">
        <section class="settings-card">
          <h2>模型服务</h2>
          <label>HTTPS API 基础地址<input id="service-url" type="url" spellcheck="false" placeholder="https://example.com/v1"></label>
          <small>保留服务地址中的版本路径。</small>
          <label>模型名称<input id="service-model" type="text" spellcheck="false" placeholder="填写模型名"></label>
          <label>API Key<input id="service-key" type="password" autocomplete="off" placeholder="留空则继续使用已保存密钥"></label>
          <small id="saved-key-status"></small>
          <div class="button-row"><button id="service-test" type="button">测试连接</button><button id="service-cancel" type="button">取消请求</button><span></span><button id="service-save" class="primary" type="button">保存服务</button></div>
          <button id="service-delete-key" type="button" class="danger text-button">删除当前地址保存的密钥</button>
          <small>密钥以明文保存在本机。测试可能产生一次请求费用，且不会保存设置。</small>
        </section>

        <section class="settings-card">
          <h2>角色设定</h2>
          <p class="hint">调整千早说话的方式与性格。保存后会结束当前对话。</p>
          <label class="sr-only" for="persona-prompt">角色设定提示词</label>
          <textarea id="persona-prompt" class="persona-editor"></textarea>
          <div class="button-row end"><button id="persona-save" class="primary" type="button">保存角色设定</button></div>
        </section>

        <section class="settings-card preferences-card">
          <h2>桌宠外观</h2>
          <div class="form-grid">
            <label>服装<select data-pref="style"><option value="a">冬服·正面</option><option value="a_">夏服·正面</option><option value="b">冬服·侧身</option><option value="b_">夏服·侧身</option><option value="c">米色便服</option><option value="d">粉色裙装</option><option value="e">体操服</option></select></label>
            <label>构图<select data-pref="framing"><option value="full">全景</option><option value="close">近景</option></select></label>
            <label>表情<select data-pref="expression"><option value="automatic">自动</option><option value="neutral">日常</option><option value="serious">认真</option><option value="smile">微笑</option><option value="surprised">惊讶</option></select></label>
            <label>大小 <output id="height-value"></output><input data-pref="height" type="range" min="240" max="480" step="8"></label>
          </div>
          <div class="checks">
            <label><input data-pref="alwaysOnTop" type="checkbox"> 始终置顶</label>
            <label><input data-pref="clickThrough" type="checkbox"> 鼠标穿透</label>
            <label><input data-pref="animations" type="checkbox"> 角色动画</label>
            <label><input data-pref="idleEnabled" type="checkbox"> 闲时问候</label>
          </div>
          <label>闲时问候频率<select data-pref="idleFrequency"><option value="frequent">经常 · 1–3 分钟</option><option value="normal">适中 · 3–7 分钟</option><option value="quiet">安静 · 10–15 分钟</option></select></label>
          <div class="button-row"><button id="pet-reset-position" type="button">重置位置</button><button id="pet-toggle-visible" type="button">隐藏／显示桌宠</button></div>
        </section>
      </div>
    </section>

    <section class="page music-page" data-page="music" role="tabpanel" hidden>
      <div class="music-heading"><div><h2>夜奏 · 背景音乐</h2><p>导入喜欢的音乐，在相伴时播放。</p></div><button id="music-import" type="button">导入音乐…</button></div>
      <div id="track-list" class="track-list"></div>
      <div class="music-controls">
        <button id="music-previous" type="button" disabled>上一首</button>
        <button id="music-toggle" type="button" class="primary" disabled>播放</button>
        <button id="music-next" type="button" disabled>下一首</button>
        <label>循环<select data-pref="musicLoop"><option value="single">单曲循环</option><option value="list">列表循环</option></select></label>
      </div>
      <label class="volume-row">音量 <input data-pref="musicVolume" type="range" min="0" max="1" step="0.01"><output id="volume-value"></output></label>
      <label class="autoplay-row"><input data-pref="musicAutoplay" type="checkbox"> 启动时播放背景音乐</label>
      <p id="music-suspended" class="hint" hidden>桌宠隐藏或电脑休眠中，音乐已暂停。</p>
      <button id="music-remove" type="button" class="danger text-button" disabled>从曲库移除所选曲目</button>
      <p class="hint">隐藏桌宠或电脑休眠时，音乐会暂停。Windows 版支持 WAV、MP3、M4A、AAC、OGG 与 FLAC。</p>
      <audio id="music-audio" preload="metadata"></audio>
    </section>

    <footer><p id="action-message" role="status" aria-live="polite"></p></footer>
  </main>
</body>
</html>
